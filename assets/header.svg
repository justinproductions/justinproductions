<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Justin Productions: web design, video production and SEO, Târgoviște, Romania">
  <defs>
    <radialGradient id="glow" cx="78%" cy="18%" r="60%">
      <stop offset="0" stop-color="#ff5b1f" stop-opacity=".45"/>
      <stop offset=".55" stop-color="#ff5b1f" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ff5b1f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="8%" cy="100%" r="45%">
      <stop offset="0" stop-color="#ff5b1f" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ff5b1f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridmask"><rect width="1200" height="340" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1200" height="340" rx="24"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .drift { animation: drift 14s ease-in-out infinite alternate; transform-origin: 900px 60px; }
      @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(-60px,20px) scale(1.08); } }
      .w { opacity: 0; animation: cycle 9s infinite; }
      .w2 { animation-delay: 3s; } .w3 { animation-delay: 6s; }
      @keyframes cycle { 0%,2% { opacity: 0; transform: translateY(14px); } 6%,30% { opacity: 1; transform: translateY(0); } 34%,100% { opacity: 0; transform: translateY(-14px); } }
      .caret { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .bar { animation: grow 2.6s cubic-bezier(.2,.8,.2,1) forwards; transform-origin: 0 0; transform: scaleX(0); }
      @keyframes grow { to { transform: scaleX(1); } }
      .dot { animation: pulse 2.4s ease-in-out infinite; transform-origin: 1086px 74px; }
      @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.35); } }
      @media (prefers-reduced-motion: reduce) { .drift,.dot,.caret,.bar { animation: none; transform: none; } .w { animation: none; } .w1 { opacity: 1; } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="#0e0e10"/>
    <rect width="1200" height="340" fill="url(#grid)" mask="url(#gridmask)"/>
    <g class="drift"><rect width="1200" height="340" fill="url(#glow)"/></g>
    <rect width="1200" height="340" fill="url(#glow2)"/>

    <!-- logo mark -->
    <g transform="translate(64 56)" fill="none" stroke="#ececea" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 6 L0 18 L10 30"/><path d="M22 2 L14 34" stroke="#ff5b1f"/><path d="M26 6 L36 18 L26 30"/>
    </g>
    <text x="114" y="82" class="mono" font-size="20" fill="#ececea" letter-spacing=".5">justin<tspan fill="#ff5b1f">.</tspan>productions</text>

    <circle class="dot" cx="1086" cy="74" r="5" fill="#3ddc84"/>
    <text x="1100" y="80" class="mono" font-size="15" fill="#8d8d93" letter-spacing="2">OPEN</text>

    <text x="64" y="176" class="sans" font-size="64" font-weight="700" fill="#ececea" letter-spacing="-2">Justin Alen Tecer</text>
    <rect class="bar" x="66" y="196" width="150" height="6" rx="3" fill="#ff5b1f"/>

    <text x="64" y="250" class="mono" font-size="26" fill="#8d8d93">I build</text>
    <g class="mono" font-size="26" fill="#ff5b1f">
      <text class="w w1" x="186" y="250">websites that bring clients.</text>
      <text class="w w2" x="186" y="250">brand films and promo videos.</text>
      <text class="w w3" x="186" y="250">search visibility that lasts.</text>
    </g>
    <rect class="caret" x="64" y="268" width="14" height="4" fill="#ff5b1f"/>

    <text x="64" y="304" class="mono" font-size="15" fill="#8d8d93" letter-spacing="3">WEB DESIGN · VIDEO · SEO   —   TÂRGOVIȘTE, ROMANIA · SINCE 2020</text>
  </g>
</svg>
