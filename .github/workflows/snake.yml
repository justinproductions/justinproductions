name: Contribution snake

# Redraws the contribution-graph animation once a day and on manual runs.
# Output goes to the `output` branch, which the README reads from.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff5b1f&color_dots=#ebedf0,#ffd6c2,#ffad85,#ff7d45,#ff5b1f
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff5b1f&color_dots=#161b22,#4a2414,#7a3416,#b8461a,#ff5b1f

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
